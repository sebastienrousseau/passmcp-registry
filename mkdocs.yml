site_name: passmcp-registry
site_description: A signed public scorecard of the MCP Registry's remote servers.
site_url: https://sebastienrousseau.com/passmcp-registry/
copyright: '&copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>'
repo_url: https://github.com/sebastienrousseau/passmcp-registry
repo_name: sebastienrousseau/passmcp-registry
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Method: method.md
  - Architecture: ARCHITECTURE.md
  - Decision records:
      - adr/README.md
      - adr/0001-run-passmcp-as-a-program.md
      - adr/0002-only-non-invoking-phases-without-credentials.md
      - adr/0003-withheld-means-absent.md
      - adr/0004-runs-start-by-hand.md
      - adr/0005-one-pages-deployer.md
  - Releases:
      - releases/v0.0.3.md
      - releases/v0.0.2.md
      - releases/v0.0.1.md
