version: "2"
linters:
  default: standard
  enable:
    - revive
    # A job that reads every answer from servers nobody vetted gets the
    # security and correctness linters, not just the standard set.
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
    - noctx
    # Complexity ceilings, shared with the rest of the passmcp family.
    - gocyclo
    - gocognit
    - nestif
    - funlen
    - maintidx
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    funlen:
      lines: 80
      statements: 50
    maintidx:
      under: 20
  exclusions:
    rules:
      # Table tests and fake servers are long by nature.
      - path: _test\.go
        linters: [errcheck, revive, gosec, bodyclose, noctx, funlen, gocognit, gocyclo, maintidx]

formatters:
  enable:
    - gofmt
