version: "2"
linters:
  default: standard
  enable:
    - revive
    # A job that reads every answer from servers nobody vetted gets the
    # security and correctness linters, not just the standard set.
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
    - noctx
    # Complexity ceilings, the portfolio's per-function limits: cyclomatic
    # 10, cognitive 15, 60 lines.
    - gocyclo
    - gocognit
    - nestif
    - funlen
    - maintidx
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 60
      statements: 50
    maintidx:
      under: 20
  exclusions:
    rules:
      # Fake servers and fixtures relax the security and error-handling
      # linters; the complexity ceilings apply to tests like any other code.
      - path: _test\.go
        linters: [errcheck, revive, gosec, bodyclose, noctx]

formatters:
  enable:
    - gofmt
