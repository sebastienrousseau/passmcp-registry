name: Feature request
description: Something the scorecard should publish or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to find out
    validations:
      required: true
  - type: textarea
    id: servers
    attributes:
      label: What it would change for the servers checked
      description: Anything that makes the job contact more, call more, or publish more needs this answered first.
