name: Manual

# Builds the manual on every change to it, strictly, so a broken link or
# nav entry fails the pull request rather than the reader; and deploys
# GitHub Pages from main. This is the only workflow that deploys Pages, and
# the site it deploys has three parts:
#
#   /                 the manual, from docs/ on main
#   /coverage.json    the shields.io endpoint document behind the README's
#                     coverage badge, measured from the commit deployed
#   /scorecard/       the published scorecard, site/ on the records branch,
#                     when that branch exists (CC-BY-4.0)
#
# Every push to main deploys, so the badge follows the code; registry-run.yml
# starts this workflow after each run, so the scorecard follows the records.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/coveragebadge/**'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manual
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # --require-hashes: the lock is passmcp's, byte for byte, so the family's
      # manuals build from the same reviewed artefacts.
      - name: Build with MkDocs
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            --require-hashes -r docs/requirements.txt
          mkdocs build --strict --site-dir public

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Statement coverage across the module, as the badge shows it. The
      # per-package gate is ci.yml's Coverage Gate; this only reports.
      - name: Measure coverage for the badge
        run: |
          set -euo pipefail
          make coverage-json
          cp build/coverage.json public/coverage.json

      # The published scorecard, as the last run left it on the records
      # branch. Read-only: this workflow never writes that branch.
      - name: Add the published scorecard
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin records >/dev/null; then
            git fetch --depth=1 origin records
            mkdir -p public/scorecard
            git archive FETCH_HEAD site | tar -x -C "${RUNNER_TEMP}"
            cp -R "${RUNNER_TEMP}/site/." public/scorecard/
          else
            echo "no records branch yet: the scorecard has not run"
          fi

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
