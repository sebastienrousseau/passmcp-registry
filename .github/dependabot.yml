version: 2
updates:
  # One direct dependency, passmcp-reporting, which moves with passmcp. The
  # passmcp binary the scorecard runs is pinned in scorecard.yml and moves
  # by hand, because a new passmcp version is a method change.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
